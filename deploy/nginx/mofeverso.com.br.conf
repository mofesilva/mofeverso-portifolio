upstream mofeverso {
      server 127.0.0.1:9010;
  }

  # HTTP server block to redirect to HTTPS
  server {
    if ($host = www.mofeverso.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = mofeverso.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


      listen 80;
      server_name mofeverso.com.br www.mofeverso.com.br;

      location / {
          return 301 https://$host$request_uri;
      }


}

  server {
      listen 8443 ssl;
      server_name mofeverso.com.br www.mofeverso.com.br;

      # Enable SSL session cache for improved performance
      ssl_session_cache shared:SSL:10m;
      #ssl_session_timeout 10m;

      location / {
          proxy_pass http://mofeverso;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      # Define additional SSL settings, such as HSTS and security headers, as needed
      add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options SAMEORIGIN;
      add_header X-XSS-Protection "1; mode=block";

    ssl_certificate /etc/letsencrypt/live/mofeverso.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mofeverso.com.br/privkey.pem; # managed by Certbot
}
