# Serviço do site, para ficar atrás do Nginx já existente no servidor Debian.
services:
  portfolio:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mofeverso.com.br}
    image: portfolio-mofe:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
